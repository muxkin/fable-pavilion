name: Compatibility contracts
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CONTRIBUTING.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'CONTRIBUTING.md', 'LICENSE']
  workflow_dispatch:
concurrency:
  group: compatibility-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/cloud-release.test.mjs
      - run: npm run typecheck:cf
      - run: npm run test:cf
      - run: npm run check:deployments
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/*/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check:public
      - run: npm run typecheck
      - run: npm run build:adapters
      - run: npm run build:server
      - run: npm run build:web
      - run: npm run package:adapters
      - uses: actions/upload-artifact@v4
        with:
          name: verified-build
          path: |
            dist/
            packages/adapter-sdk/dist/
            packages/adapter-codex/dist/
            packages/adapter-dsh/dist/
          retention-days: 7
  native-connectors:
    needs: build-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/*/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: verified-build
          path: .
      - run: npm test
        if: runner.os == 'Linux'
      - run: npx vitest run test/platform-connectors.test.ts packages/adapter-dsh/test/backend.test.ts packages/adapter-dsh/test/connection.test.ts test/adapter-host.test.ts test/adapter-manager.test.ts test/conversation-controls.test.ts test/store.test.ts
        if: runner.os != 'Linux'
      - run: npm run test:packages
  browser-contracts:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: workbench
            scripts: test:delivery test:conversation-replay test:mobile-back test:browser
          - name: messaging
            scripts: test:messaging test:messaging-design test:im-calls
          - name: layout
            scripts: test:composer test:frontend test:layout test:controls
    name: browser-contracts (${{ matrix.group.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: verified-build
          path: .
      - name: Prepare Chrome for browser tests
        run: |
          if ! node --input-type=module -e '
            import { chromium } from "@playwright/test";
            const browser = await chromium.launch({ channel: "chrome" });
            await browser.close();
          '; then
            npx playwright install --with-deps chrome
          fi
      - name: Run browser contracts (one retry per script)
        env:
          TEST_ARTIFACTS: ${{ runner.temp }}/browser-artifacts
        run: |
          set -u
          failed=0
          for script in ${{ matrix.group.scripts }}; do
            for attempt in 1 2; do
              out="$TEST_ARTIFACTS/${script//:/-}-attempt$attempt"
              mkdir -p "$out"
              echo "::group::$script (attempt $attempt)"
              if TEST_OUTPUT="$out" npm run "$script"; then
                echo "::endgroup::"
                break
              fi
              echo "::endgroup::"
              if [ "$attempt" = 2 ]; then
                echo "::error::$script failed twice"
                failed=1
              else
                echo "::warning::$script failed once; retrying"
              fi
            done
          done
          exit $failed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.group.name }}
          path: ${{ runner.temp }}/browser-artifacts
          if-no-files-found: ignore
          retention-days: 7
