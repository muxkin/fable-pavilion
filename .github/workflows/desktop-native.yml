name: Pure Rust desktop installer checks
on:
  workflow_dispatch:
  push:
    tags: [native-rust-qa-v*]
  pull_request:
    paths:
      - 'desktop/native/**'
      - 'assets/branding/zixuting/wuyou.ico'
      - 'src/web/public/app-icon-*.png'
      - 'src/web/public/app-icons/wuyou-*.png'
      - 'scripts/desktop/**'
      - 'src/shared/desktop-releases.ts'
      - 'src/server/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-native.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            binary: agent-space-native
          - os: windows-latest
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            binary: agent-space-native.exe
          - os: macos-15
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            binary: agent-space-native
          - os: macos-15-intel
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
            binary: agent-space-native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Ubuntu APT mirrors
        if: runner.os == 'Linux'
        run: |
          mirror_list=/etc/apt/apt-mirrors.txt
          if [[ ! -f "$mirror_list" ]]; then exit 0; fi

          mirror=https://mirrors.edge.kernel.org/ubuntu/
          updated_list=$(mktemp)
          trap 'rm -f -- "$updated_list"' EXIT
          printf '%s\tpriority:0\n' "$mirror" > "$updated_list"
          awk -v mirror="$mirror" '$1 != mirror' "$mirror_list" >> "$updated_list"
          sudo install -m 0644 "$updated_list" "$mirror_list"

          # Move to the next mirror when a request fails on Jammy.
          printf '%s\n' 'Acquire::Retries "0";' |
            sudo tee /etc/apt/apt.conf.d/zzzz-agent-space-mirror-failover >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          if command -v desktop-file-validate >/dev/null && command -v pkexec >/dev/null && command -v zstd >/dev/null; then
            exit 0
          fi
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install -y desktop-file-utils pkexec zstd
      - if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - run: npm ci --ignore-scripts
      - name: Build the Rust adapter with system tray
        working-directory: desktop/native
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: cargo build --release --locked
      - name: Build the official Codex, DSH and Antigravity plugins
        if: runner.os != 'Linux'
        working-directory: desktop/native
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: cargo build --release --locked --no-default-features --features official-plugins --bin agent-space-adapter-codex --bin agent-space-adapter-dsh --bin agent-space-adapter-antigravity
      - name: Build the static musl gateway and Linux plugins
        if: runner.os == 'Linux'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src" --workdir /src/desktop/native \
            rust:1.95.0-alpine sh -ec '
              cargo build --release --locked --target x86_64-unknown-linux-musl \
                --no-default-features --bin agent-space-native
              cargo build --release --locked --target x86_64-unknown-linux-musl \
                --no-default-features --features official-plugins \
                --bin agent-space-adapter-codex --bin agent-space-adapter-dsh --bin agent-space-adapter-antigravity
            '
      - name: Package the official Codex, DSH and Antigravity plugins
        shell: bash
        run: |
          bin_dir=desktop/native/target/release
          target=${{ matrix.target }}
          if [[ "${{ runner.os }}" == Linux ]]; then
            target=x86_64-unknown-linux-musl
            bin_dir=desktop/native/target/$target/release
          fi
          for product in codex dsh antigravity; do
            node scripts/desktop/native-plugin-package.mjs "$product" "$bin_dir/agent-space-adapter-$product${{ runner.os == 'Windows' && '.exe' || '' }}" "dist/native-official-plugins/$product" "$target"
          done
      - name: Verify the pure Rust package contract
        run: npx vitest run test/native-package-contract.test.mjs
      - name: Package the Rust adapter
        run: node scripts/desktop/native-package.mjs ${{ matrix.platform }} desktop/native/target/release/${{ matrix.binary }} ${{ matrix.target }} dist/native-official-plugins --installer
      - name: Verify the localized tray name
        if: runner.os != 'Linux'
        working-directory: desktop/native
        run: cargo test --release --locked --lib localizes_tray_display_name
      - name: Verify encrypted keybook import and offline local access
        run: node --import tsx scripts/desktop/native-keybook-smoke.ts desktop/native/target/release/${{ matrix.binary }}
      - name: Package and verify the static musl gateway
        if: runner.os == 'Linux'
        env:
          POCKET_NATIVE_TEST_IPC: '1'
          POCKET_NATIVE_TEST_BUNDLED_PLUGINS: '1'
        run: |
          target=x86_64-unknown-linux-musl
          node scripts/desktop/native-package.mjs linux "desktop/native/target/$target/release/agent-space-native" "$target" dist/native-official-plugins
          bundle=$(mktemp -d)
          tar -xJf dist/desktop-native-preview/*-linux-x64-musl.tar.xz --strip-components=1 -C "$bundle"
          node --import tsx scripts/desktop/native-smoke.ts "$bundle/agent-space-native"
          node --import tsx scripts/desktop/native-dsh-smoke.ts "$bundle/agent-space-native"
          docker run --rm --volume "$bundle:/bundle:ro" rust:1.95.0-alpine sh -ec '
            export POCKET_NATIVE_STATE_DIR=/tmp/adapter-state
            /bundle/agent-space-native --adapter install /bundle/official-plugins/codex
            /bundle/agent-space-native --adapter install /bundle/official-plugins/dsh
            /bundle/agent-space-native --adapter install /bundle/official-plugins/antigravity
          '
      - name: Build and package the portable musl desktop
        if: runner.os == 'Linux'
        run: |
          node scripts/desktop/native-musl-test-deps.mjs
          docker build --target build -f scripts/desktop/native-musl.Dockerfile -t agent-space-musl-build scripts/desktop
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/src:ro" --workdir /src \
            agent-space-musl-build node --import tsx --input-type=module -e '
              import sharp from "sharp";
              await import("./scripts/desktop/native-rust-update-noise.ts");
              const bytes = await sharp({create:{width:1,height:1,channels:4,background:"#fff"}}).png().toBuffer();
              const decoded = await sharp(bytes).webp().toBuffer();
              if (!decoded.length) throw Error("Musl codec returned an empty image");
              console.log("Musl shared Noise fixture and bitmap codec loaded");
            '
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/src" --workdir /src \
            agent-space-musl-build sh -ec '
              export CARGO_TARGET_DIR=/src/dist/native-musl-target
              cargo build --manifest-path desktop/native/Cargo.toml --release --locked \
                --target x86_64-unknown-linux-musl --bin agent-space-native
            '
          binary=dist/native-musl-target/x86_64-unknown-linux-musl/release/agent-space-native
          node scripts/desktop/native-package.mjs linux "$binary" \
            x86_64-unknown-linux-musl dist/native-official-plugins --musl-desktop
          bash scripts/desktop/native-musl-desktop-smoke.sh \
            dist/desktop-native-preview/*-musl-desktop.tar.zst agent-space-musl-build
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/src" --workdir /src \
            -e POCKET_QA_DISPOSABLE_INSTALL=1 -e POCKET_QA_LINUX_MUSL_DESKTOP=1 \
            -e CARGO_TARGET_DIR=/src/dist/native-musl-target \
            agent-space-musl-build node scripts/desktop/native-rust-update-smoke.mjs \
              dist/desktop-native-preview "$binary"
      - name: Install and verify the Debian package and its default plugins
        if: runner.os == 'Linux'
        env:
          POCKET_NATIVE_TEST_IPC: '1'
          POCKET_NATIVE_TEST_BUNDLED_PLUGINS: '1'
        run: |
          sudo dpkg -i dist/desktop-native-preview/*.deb
          cmp /usr/bin/agent-space-native desktop/native/target/release/agent-space-native
          desktop-file-validate /usr/share/applications/org.agent-space.adapter.desktop
          grep -Fx 'Name=Fable Pavilion Adapter' /usr/share/applications/org.agent-space.adapter.desktop
          grep -Fx 'Name[zh]=子虚亭适配器' /usr/share/applications/org.agent-space.adapter.desktop
          cmp src/web/public/app-icons/wuyou-512.png /usr/share/icons/hicolor/512x512/apps/org.agent-space.adapter.png
          test ! -e /usr/lib/agent-space-native/gateway
          (cd desktop/native && cargo build --release --locked --example native-storage-fixture)
          POCKET_NATIVE_TEST_STORAGE_PLUGIN=desktop/native/target/release/examples/native-storage-fixture \
            node --import tsx scripts/desktop/native-smoke.ts /usr/bin/agent-space-native
          node --import tsx scripts/desktop/native-dsh-smoke.ts /usr/bin/agent-space-native
          cd desktop/native
          cargo test --release --locked --features official-plugins
      - name: Mount and verify the macOS installer and its default plugins
        if: runner.os == 'macOS'
        env:
          POCKET_NATIVE_TEST_IPC: '1'
          POCKET_NATIVE_TEST_BUNDLED_PLUGINS: '1'
        run: |
          set -euo pipefail
          mount=$(mktemp -d)
          hdiutil attach dist/desktop-native-preview/*.dmg -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"; rmdir "$mount"' EXIT
          app="$mount/Agent Space Adapter.app"
          test -L "$mount/Applications"
          codesign --verify --deep --strict "$app"
          plist="$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = 'org.agent-space.adapter'
          test "$(plutil -extract CFBundleExecutable raw "$plist")" = 'agent-space-native'
          test "$(plutil -extract CFBundleDisplayName raw "$plist")" = 'Agent Space Adapter'
          test "$(plutil -extract LSHasLocalizedDisplayName raw "$plist")" = 'true'
          for locale in en zh-Hans zh-Hant; do
            strings="$app/Contents/Resources/$locale.lproj/InfoPlist.strings"
            plutil -lint "$strings"
            label='子虚亭适配器'
            [[ "$locale" != en ]] || label='Fable Pavilion Adapter'
            for key in CFBundleName CFBundleDisplayName; do
              test "$(plutil -extract "$key" raw "$strings")" = "$label"
            done
          done
          test ! -e "$app/Contents/Resources/gateway"
          node --import tsx scripts/desktop/native-smoke.ts "$app/Contents/MacOS/agent-space-native"
      - name: Build the workbench for the Windows Edge regression
        if: runner.os == 'Windows'
        run: npm run build:web
      - name: Verify Windows install, reinstall and uninstall
        if: runner.os == 'Windows'
        env:
          POCKET_NATIVE_TEST_IPC: '1'
          POCKET_NATIVE_TEST_BUNDLED_PLUGINS: '1'
        run: |
          $setup = (Get-Item dist/desktop-native-preview/*-setup.exe).FullName
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Agent Space Adapter'
          $exe = Join-Path $dir 'agent-space-native.exe'
          $expected = (Get-FileHash desktop/native/target/release/agent-space-native.exe).Hash
          $runSubkey = 'Software\Microsoft\Windows\CurrentVersion\Run'
          $runKey = "HKCU:\$runSubkey"
          $runName = 'agent-space-native'
          function Get-AdapterRunCommand {
            [Microsoft.Win32.Registry]::GetValue("HKEY_CURRENT_USER\$runSubkey", $runName, $null)
          }
          foreach ($attempt in 1..2) {
            $process = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0 -or (Get-FileHash $exe).Hash -ne $expected) { throw 'Installation failed' }
            if ($attempt -eq 1) {
              if ($null -ne (Get-AdapterRunCommand)) { throw 'Fresh installation enabled startup automatically' }
              if (!(Test-Path $runKey)) { New-Item -Path $runKey | Out-Null }
              New-ItemProperty -Path $runKey -Name $runName -Value "$exe --background" -PropertyType String | Out-Null
            }
          }
          $command = '"{0}" --background' -f $exe
          if ((Get-AdapterRunCommand) -cne $command) { throw 'Reinstall did not repair the legacy startup command' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Agent Space Adapter.lnk'
          if (!(Test-Path -LiteralPath $shortcut)) { throw 'Existing Start menu shortcut path was not preserved' }
          $displayName = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AgentSpaceNative').DisplayName
          if ($displayName -cne 'Fable Pavilion Adapter') { throw 'Installed Apps does not show the expected English name' }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class AdapterNameResources {
              [DllImport("shell32.dll", ExactSpelling = true, CharSet = CharSet.Unicode)]
              public static extern int SHGetLocalizedName(string path, StringBuilder module, uint length, out int id);

              [DllImport("kernel32.dll", ExactSpelling = true, CharSet = CharSet.Unicode)]
              private static extern uint GetLongPathNameW(string shortPath, StringBuilder longPath, uint length);

              public static string CanonicalPath(string path) {
                  if (String.IsNullOrEmpty(path)) return path;
                  var longPath = new StringBuilder(32768);
                  uint length = GetLongPathNameW(path, longPath, (uint)longPath.Capacity);
                  return length > 0 && length < longPath.Capacity ? longPath.ToString() : path;
              }

              [DllImport("kernel32.dll", ExactSpelling = true, CharSet = CharSet.Unicode)]
              private static extern IntPtr LoadLibraryExW(string name, IntPtr file, uint flags);

              [DllImport("kernel32.dll", ExactSpelling = true, CharSet = CharSet.Unicode)]
              private static extern IntPtr FindResourceExW(IntPtr module, IntPtr type, IntPtr name, ushort language);

              [DllImport("kernel32.dll", ExactSpelling = true)]
              private static extern IntPtr LoadResource(IntPtr module, IntPtr resource);

              [DllImport("kernel32.dll", ExactSpelling = true)]
              private static extern IntPtr LockResource(IntPtr resource);

              [DllImport("kernel32.dll", ExactSpelling = true)]
              private static extern bool FreeLibrary(IntPtr module);

              public static string ReadLocalizedName(string path, int id, ushort language) {
                  IntPtr module = LoadLibraryExW(path, IntPtr.Zero, 0x22);
                  if (module == IntPtr.Zero) throw new InvalidOperationException("Cannot load adapter resources");
                  try {
                      // RT_STRING stores sixteen length-prefixed UTF-16 strings per block.
                      IntPtr resource = FindResourceExW(module, (IntPtr)6, (IntPtr)(id / 16 + 1), language);
                      if (resource == IntPtr.Zero) throw new InvalidOperationException("Missing localized adapter name");
                      IntPtr strings = LockResource(LoadResource(module, resource));
                      if (strings == IntPtr.Zero) throw new InvalidOperationException("Cannot read localized adapter name");
                      for (int slot = 0; slot < id % 16; slot++) {
                          strings += (1 + (ushort)Marshal.ReadInt16(strings)) * sizeof(char);
                      }
                      return Marshal.PtrToStringUni(strings + sizeof(char), (ushort)Marshal.ReadInt16(strings));
                  } finally { FreeLibrary(module); }
              }
          }
          '@
          $module = [Text.StringBuilder]::new(1024)
          $resourceId = 0
          $result = [AdapterNameResources]::SHGetLocalizedName($shortcut, $module, $module.Capacity, [ref]$resourceId)
          if ($result -ne 0 -or [Math]::Abs($resourceId) -ne 101) {
            throw ('Shortcut localization returned HRESULT 0x{0:X8}, resource {1}, module {2}' -f $result, $resourceId, $module)
          }
          $modulePath = [Environment]::ExpandEnvironmentVariables($module.ToString().Trim('"'))
          $canonicalModule = [AdapterNameResources]::CanonicalPath($modulePath)
          if ($canonicalModule -ine [AdapterNameResources]::CanonicalPath($exe)) {
            throw "Shortcut localization points to '$modulePath' (canonical '$canonicalModule') instead of '$exe'"
          }
          foreach ($language in @{0x0409='Fable Pavilion Adapter'; 0x0804='子虚亭适配器'; 0x0404='子虚亭适配器'}.GetEnumerator()) {
            if ([AdapterNameResources]::ReadLocalizedName($exe, 101, $language.Key) -cne $language.Value) { throw 'Incorrect localized shortcut display name' }
          }
          $verifyIcon = @'
          const assert = require('node:assert/strict');
          const {readFileSync} = require('node:fs');
          const icon = readFileSync('assets/branding/zixuting/wuyou.ico');
          for (const path of process.argv.slice(1)) {
            const executable = readFileSync(path);
            for (let index = 0; index < icon.readUInt16LE(4); index++) {
              const entry = 6 + index * 16;
              const offset = icon.readUInt32LE(entry + 12);
              const length = icon.readUInt32LE(entry + 8);
              assert(executable.includes(icon.subarray(offset, offset + length)), `${path}: missing ${icon[entry] || 256}px Wu You icon`);
            }
          }
          '@
          node -e $verifyIcon $setup $exe
          if ($LASTEXITCODE -ne 0) { throw 'Installer or installed adapter icon check failed' }
          $startupState = Join-Path $env:RUNNER_TEMP ('agent-space-autostart-' + [Guid]::NewGuid().ToString('N'))
          $background = Start-Process -FilePath $exe -ArgumentList '--background' -WorkingDirectory $env:SystemRoot `
            -Environment @{POCKET_NATIVE_STATE_DIR = $startupState} -PassThru
          try {
            $endpoint = Join-Path $startupState 'management.json'
            for ($attempt = 0; $attempt -lt 100 -and !(Test-Path $endpoint) -and !$background.HasExited; $attempt++) {
              Start-Sleep -Milliseconds 100
            }
            if (!(Test-Path $endpoint) -or $background.HasExited) { throw 'Installed adapter did not start in the background' }
          } finally {
            if (!$background.HasExited) {
              Stop-Process -InputObject $background -Force
              $background.WaitForExit()
            }
            Remove-Item -LiteralPath $startupState -Recurse -Force -ErrorAction SilentlyContinue
          }
          node --import tsx scripts/desktop/native-smoke.ts $exe
          if ($LASTEXITCODE -ne 0) { throw 'Installed adapter protocol or plugin check failed' }
          $antigravity = Join-Path $dir 'official-plugins\antigravity'
          $entry = 'agent-space-adapter-antigravity.exe'
          if ((Get-FileHash (Join-Path $antigravity $entry)).Hash -ne (Get-FileHash "dist/native-official-plugins/antigravity/$entry").Hash) {
            throw 'Installed Antigravity binary differs from the verified package'
          }
          $env:POCKET_NATIVE_TEST_BROWSER = 'msedge'
          $env:POCKET_NATIVE_TEST_BROWSER_HEADED = '1'
          $env:POCKET_NATIVE_TEST_RENDERER_RECOVERY = '1'
          node --import tsx scripts/desktop/native-antigravity-smoke.ts $exe $antigravity
          if ($LASTEXITCODE -ne 0) { throw 'Installed Antigravity protocol or Edge regression failed' }
          if (Test-Path (Join-Path $dir 'gateway')) { throw 'Unexpected gateway runtime' }
          if ((Get-AuthenticodeSignature -LiteralPath $setup).Status -ne 'NotSigned') { throw 'Unexpected publisher signature' }
          # Uninstall only the packaged files, even when an unrelated file exists alongside them.
          New-Item -Path (Join-Path $dir 'keep.txt') -ItemType File | Out-Null
          $process = Start-Process -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path $exe) -or (Test-Path (Join-Path $dir 'official-plugins')) -or !(Test-Path (Join-Path $dir 'keep.txt'))) { throw 'Uninstall failed' }
          if ($null -ne (Get-AdapterRunCommand)) { throw 'Uninstall left the adapter startup command installed' }
          if (Test-Path -LiteralPath $shortcut) { throw 'Uninstall left the adapter Start menu shortcut installed' }
      - name: Verify the signed HTTPS update through the installed adapter
        shell: bash
        run: node scripts/desktop/native-rust-update-smoke.mjs dist/desktop-native-preview desktop/native/target/release/${{ matrix.binary }}
      - name: Verify the signed HTTPS update in a Linux user installation
        if: runner.os == 'Linux'
        env:
          POCKET_QA_LINUX_USER_INSTALL: '1'
        run: node scripts/desktop/native-rust-update-smoke.mjs dist/desktop-native-preview desktop/native/target/release/${{ matrix.binary }}
      - name: Build the console binary and check Windows update rollback
        if: runner.os == 'Windows'
        working-directory: desktop/native
        run: |
          cargo build --release --locked --no-default-features
          cargo test --release --locked --no-default-features --lib windows_update_recovers_the_old_executable_and_bundle_after_a_partial_install
      - name: Verify the Rust gateway and Named Pipe on Windows
        if: runner.os == 'Windows'
        env:
          POCKET_NATIVE_TEST_IPC: '1'
        run: node --import tsx scripts/desktop/native-smoke.ts desktop/native/target/release/${{ matrix.binary }} dist/native-official-plugins/codex
      - name: Verify shared control, maintenance and platform connection contracts
        working-directory: desktop/native
        run: cargo test --release --locked --no-default-features --features official-plugins --lib
      - name: Build the independent Rust plugin fixture
        working-directory: desktop/native
        run: cargo build --release --locked --no-default-features --example native-plugin-fixture
      - name: Verify native plugin install, recovery and rollback
        run: node --import tsx scripts/desktop/native-plugin-smoke.ts desktop/native/target/release/${{ matrix.binary }} desktop/native/target/release/examples/native-plugin-fixture${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Build the independent IM and call fixture
        working-directory: desktop/native
        run: cargo build --release --locked --no-default-features --example native-im-fixture
      - name: Verify existing Agent identity, encrypted messaging and WebRTC calls
        env:
          POCKET_NATIVE_TEST_STANDALONE_CALL: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: node --import tsx scripts/desktop/native-rust-im-smoke.ts desktop/native/target/release/${{ matrix.binary }} desktop/native/target/release/examples/native-im-fixture${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Verify the packaged static musl gateway supports independent Agent calls
        if: runner.os == 'Linux'
        env:
          POCKET_NATIVE_TEST_STANDALONE_CALL: '1'
        run: |
          bundle=$(mktemp -d)
          tar -xJf dist/desktop-native-preview/*-linux-x64-musl.tar.xz --strip-components=1 -C "$bundle"
          node --import tsx scripts/desktop/native-rust-im-smoke.ts "$bundle/agent-space-native" \
            desktop/native/target/release/examples/native-im-fixture
      - name: Verify the external Codex plugin and online version switches
        env:
          POCKET_NATIVE_TEST_IPC: '1'
        run: node --import tsx scripts/desktop/native-smoke.ts desktop/native/target/release/${{ matrix.binary }} dist/native-official-plugins/codex
      - name: Verify the external DSH plugin through the installed Rust gateway
        if: runner.os == 'Linux'
        run: node --import tsx scripts/desktop/native-dsh-smoke.ts desktop/native/target/release/${{ matrix.binary }} dist/native-official-plugins/dsh
      - uses: actions/upload-artifact@v4
        with:
          name: agent-space-adapter-codex-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/native-official-plugins/codex/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: agent-space-adapter-dsh-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/native-official-plugins/dsh/
          if-no-files-found: error
      - name: Verify the independent Antigravity plugin
        if: runner.os != 'Windows'
        run: node --import tsx scripts/desktop/native-antigravity-smoke.ts desktop/native/target/release/${{ matrix.binary }} dist/native-official-plugins/antigravity
      - uses: actions/upload-artifact@v4
        with:
          name: agent-space-adapter-antigravity-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/native-official-plugins/antigravity/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: agent-space-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/desktop-native-preview/AgentSpace-Native-*.zip
            dist/desktop-native-preview/AgentSpace-Native-*.tar.xz
            dist/desktop-native-preview/AgentSpace-Native-*.tar.zst
            dist/desktop-native-preview/AgentSpace-Native-*.deb
            dist/desktop-native-preview/AgentSpace-Native-*.dmg
            dist/desktop-native-preview/AgentSpace-Native-*-setup.exe
            dist/desktop-native-preview/AgentSpace-Native-*.sha256
          if-no-files-found: error
